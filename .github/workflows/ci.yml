name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      # Debug build: overflow checks and debug assertions (such as the
      # no-overlap check after every compaction) are on.
      - run: cargo test
        env:
          QDB_SEEDS: "30"

  simulate:
    name: storage crash simulation, 2000 seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: ./target/release/quorumdb sim --seeds 2000 --steps 2000
      - name: every planted bug is caught
        run: |
          for fault in skip-wal-truncate skip-dir-sync no-sync-before-manifest drop-tombstones-early; do
            if ./target/release/quorumdb sim --seeds 500 --fault "$fault"; then
              echo "planted bug $fault was not caught" >&2
              exit 1
            fi
          done

  raft:
    name: raft simulation, 1000 clusters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: ./target/release/quorumdb raft-sim --seeds 1000
      - name: every planted raft bug is caught
        run: |
          for fault in vote-ignores-log commit-old-term skip-prev-check read-without-quorum; do
            if ./target/release/quorumdb raft-sim --seeds 3000 --fault "$fault"; then
              echo "planted bug $fault was not caught" >&2
              exit 1
            fi
          done

  cluster:
    name: cluster simulation, 500 clusters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: ./target/release/quorumdb kv-sim --seeds 500
      - name: every planted cluster bug is caught
        run: |
          for fault in skip-raft-sync stale-local-reads snapshot-self-removal; do
            if ./target/release/quorumdb kv-sim --seeds 500 --fault "$fault"; then
              echo "planted bug $fault was not caught" >&2
              exit 1
            fi
          done

  transactions:
    name: transaction simulation, 200 clusters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: ./target/release/quorumdb txn-sim --seeds 200
      - name: every planted transaction bug is caught
        run: |
          for fault in skip-write-conflict read-ignores-locks skip-read-validation tso-serve-before-durable; do
            if ./target/release/quorumdb txn-sim --seeds 200 --fault "$fault"; then
              echo "planted bug $fault was not caught" >&2
              exit 1
            fi
          done

  psql:
    name: psql against a real 3-node server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get install -y postgresql-client
      - run: cargo build --release
      - name: start the server
        run: |
          ./target/release/quorumdb server "$RUNNER_TEMP/data" --listen 127.0.0.1:5433 &
          sleep 2
      - name: run a SQL session through psql
        run: |
          psql -h 127.0.0.1 -p 5433 -U quorum -d quorum -v ON_ERROR_STOP=0 -f examples/demo.sql | tee out.txt
          grep -q "Chen | *2 | *522.25" out.txt
          grep -q "Range scan orders" out.txt
      - name: restart the server; the data is still there
        run: |
          pkill -x quorumdb
          sleep 1
          ./target/release/quorumdb server "$RUNNER_TEMP/data" --listen 127.0.0.1:5433 &
          sleep 2
          psql -h 127.0.0.1 -p 5433 -U quorum -d quorum -tA -c "SELECT COUNT(*) FROM customers" | grep -qx 4

  bench:
    name: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: ./target/release/quorumdb bench "$RUNNER_TEMP/bench" | tee -a "$GITHUB_STEP_SUMMARY"
